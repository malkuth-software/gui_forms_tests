# check_std_rules for GUI.Forms' tests (D15, decision 6a), the rules gui_forms
# checks in its own tree (gui_forms tools/std_rules.toml), over tests/ and
# the measurement programs and fuzz targets that came with them. The
# tool is gui_forms' tools/check_std_rules.py, from the test cache's source
# tree; the house-style job runs:
#   python3 -I <cache>/source/tools/check_std_rules.py --config tools/std_rules.toml
# The allowance shrinks only: fix a finding, then lower or drop its line.
format = 1
root = ".."
profile = "consumer"
paths = ["tests", "file_manager_demoboard/tests", "benchmarks", "fuzz"]
# Native code, where the host-only rules (pthread, wchar_t and the rest)
# do not apply: the tests and probes that drive a native host or its system
# interfaces directly.
host_paths = [
    "tests/windows_*",
    "tests/macos_*",
    "tests/linux_*",
    "tests/support/windows_*",
    "tests/abi/host/*",
    "tests/abi/msvc/*",
    "tests/application_native_tests.cpp",
    # The C ABI's C programs: C has no portable thread, so the C11 runtime
    # test and the conformance runner start their threads natively.
    "tests/abi/gf_abi_runtime_c11_tests.c",
    "tests/abi/conformance/*",
]
exclude = ["tests/form_language/generated/*"]
allowance = "tools/std_rules_allowance.txt"
