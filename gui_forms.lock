# The gui_forms commit these tests build against, and the SHA-256 of each
# test cache gui_forms CI published for it (release test-cache-<commit>,
# packed by gui_forms tools/test_cache.py). tools/fetch_test_cache.py
# downloads and checks the cache; tools/update_lock.py moves the pin and
# copies the digests from the release. The commit below is the gui_forms
# change that moved the tests out (claude/tests-repo-split); its digests come
# with the first checkpoint push whose CI publishes test-cache-<commit>.
